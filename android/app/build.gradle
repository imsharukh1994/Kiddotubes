plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing credentials are NEVER stored in source control.
// Resolution order: android/keystore.properties (git-ignored) -> -P / ~/.gradle/gradle.properties -> environment variables.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String name ->
    keystoreProps.getProperty(name) ?: project.findProperty(name) ?: System.getenv(name) ?: ''
}

android {
    namespace 'com.kiddotube.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.pixelsdevelopments.kiddotubes"
        minSdk 24
        targetSdk 36
        versionCode 8
        versionName "1.0.7"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            def storeFilePath = signingValue('RELEASE_STORE_FILE') ?: 'release-key.jks'
            storeFile file(storeFilePath)
            storePassword signingValue('RELEASE_STORE_PASSWORD')
            keyAlias signingValue('RELEASE_KEY_ALIAS')
            keyPassword signingValue('RELEASE_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    androidResources {
        ignoreAssetsPattern ''
    }
    aaptOptions {
        ignoreAssetsPattern ''
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation project(':capacitor-android')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    // Retrofit & OkHttp for communicating with Next.js Backend
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Coil for Image Loading
    implementation 'io.coil-kt:coil-compose:2.6.0'

    // WebView for YouTube Player
    implementation 'androidx.webkit:webkit:1.10.0'

    // Google Play Billing Library v8.0.0
    implementation 'com.android.billingclient:billing:8.0.0'

    implementation 'androidx.appcompat:appcompat:1.7.1'
}
